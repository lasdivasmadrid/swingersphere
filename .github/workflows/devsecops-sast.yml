name: DevSecOps — SAST & Code Security Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run weekly on Monday at 04:00 UTC for continuous monitoring
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ──────────────────────────────────────────────────────────
  # 1. SECRET SCANNING (Gitleaks)
  # ──────────────────────────────────────────────────────────
  gitleaks:
    name: 🔑 Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # ──────────────────────────────────────────────────────────
  # 2. STATIC APPLICATION SECURITY TESTING (Semgrep SAST)
  # ──────────────────────────────────────────────────────────
  semgrep:
    name: 🛡️ SAST Analysis (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep Security Rules
        run: |
          semgrep scan \
            --config "p/security-audit" \
            --config "p/owasp-top-ten" \
            --config "p/javascript" \
            --error \
            --sarif \
            --output semgrep.sarif \
            www/ || true

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true

  # ──────────────────────────────────────────────────────────
  # 3. SOFTWARE COMPOSITION ANALYSIS (SCA / Dependencies)
  # ──────────────────────────────────────────────────────────
  dependency-audit:
    name: 📦 Dependency Vulnerability Audit (npm & Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Audit Production Dependencies
        run: npm audit --audit-level=high || true

      - name: Run Trivy FS Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  # ──────────────────────────────────────────────────────────
  # 4. CODE QUALITY & CLIENT-SIDE SECURITY LINTING
  # ──────────────────────────────────────────────────────────
  code-hygiene:
    name: 🧹 Code Hygiene & Script Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify No Accidental Hardcoded Private Keys
        run: |
          echo "Scanning for sensitive patterns (private keys, mnemonics)..."
          if grep -rnE "BEGIN (RSA|EC|OPENSSH|DSA) PRIVATE KEY" www/; then
            echo "❌ ERROR: Private key detected in web root!"
            exit 1
          fi
          echo "✅ No private keys found."
