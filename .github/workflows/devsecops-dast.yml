name: DevSecOps — DAST Web & API Security Scan (OWASP ZAP)

on:
  schedule:
    # Run weekly on Sunday at 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL to scan (Target Web / API)'
        required: true
        default: 'https://www.swingersphere.com'
      scan_type:
        description: 'Scan Type (baseline / full / api)'
        required: true
        default: 'baseline'
        type: choice
        options:
          - baseline
          - full

permissions:
  contents: read
  issues: write

jobs:
  # ──────────────────────────────────────────────────────────
  # DAST SCAN WITH OWASP ZED ATTACK PROXY (ZAP)
  # ──────────────────────────────────────────────────────────
  owasp-zap-scan:
    name: 🌐 OWASP ZAP Dynamic Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Target URL
        id: set-target
        run: |
          TARGET="${{ github.event.inputs.target_url || 'https://www.swingersphere.com' }}"
          echo "target=$TARGET" >> $GITHUB_OUTPUT

      - name: Run OWASP ZAP Baseline Scan
        if: "${{ github.event.inputs.scan_type != 'full' }}"
        uses: zaproxy/action-baseline@v0.14.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          target: '${{ steps.set-target.outputs.target }}'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          allow_issue_writing: false
        continue-on-error: true

      - name: Run OWASP ZAP Full Scan
        if: "${{ github.event.inputs.scan_type == 'full' }}"
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          target: '${{ steps.set-target.outputs.target }}'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          allow_issue_writing: false
        continue-on-error: true
